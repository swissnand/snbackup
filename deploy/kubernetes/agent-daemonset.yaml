# SWISSNAND Backup – Agent auf jedem Kubernetes-Node
# Voraussetzung (Token «mehrfach verwendbar» in der Web-Konsole unter «Agenten» erzeugen):
#   kubectl create namespace snbackup
#   kubectl -n snbackup create secret generic snbackup-agent \
#     --from-literal=server=https://backup.firma.ch:8550 \
#     --from-literal=token=snbe_… --from-literal=fingerprint=sha256:…
#   kubectl apply -f agent-daemonset.yaml
# Jeder Node meldet sich mit seinem Node-Namen als eigener Agent an.
# Jobs sichern z. B. /var/lib/kubelet/pods, /etc/kubernetes oder hostPath-Volumes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: snbackup-agent
  namespace: snbackup
  labels: { app.kubernetes.io/name: snbackup-agent }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: snbackup-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: snbackup-agent }
    spec:
      tolerations:
        - operator: Exists          # auch auf Control-Plane-Nodes
      containers:
        - name: agent
          image: ghcr.io/swissnand/snbackup:latest
          args: ["agent", "run", "--data", "/state"]
          env:
            - name: SNB_SERVER
              valueFrom: { secretKeyRef: { name: snbackup-agent, key: server } }
            - name: SNB_ENROLL_TOKEN
              valueFrom: { secretKeyRef: { name: snbackup-agent, key: token } }
            - name: SNB_FINGERPRINT
              valueFrom: { secretKeyRef: { name: snbackup-agent, key: fingerprint, optional: true } }
            - name: SNB_AGENT_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: SNB_HOST_ROOT, value: /host }
            - { name: TZ, value: Europe/Zurich }
          volumeMounts:
            - { name: host, mountPath: /host, readOnly: true }   # für Wiederherstellungen auf false setzen
            - { name: state, mountPath: /state }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsUser: 0             # liest Dateien aller Benutzer
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["DAC_READ_SEARCH", "CHOWN", "FOWNER"] }
      volumes:
        - name: host
          hostPath: { path: / }
        - name: state                # Identität des Agents bleibt über Neustarts erhalten
          hostPath: { path: /var/lib/snbackup-agent, type: DirectoryOrCreate }
        - name: tmp
          emptyDir: {}
